name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "eduescale-desktop/uv.lock"
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Run tests, lint, and Windows builds
        run: uv run --locked --group nox nox -s tests lint build
        working-directory: eduescale-desktop
      - name: Verify Windows installer
        shell: pwsh
        working-directory: eduescale-desktop
        run: |
          $installer = Get-ChildItem ".\dist\installer\EduEscale-Setup-*.exe" -File
          if ($null -eq $installer) {
            throw "The Inno Setup installer was not generated."
          }
      - name: Smoke-test scraper executable
        run: .\dist\eduescale-scraper\eduescale-scraper.exe list
        working-directory: eduescale-desktop
      - name: Verify packaged TLS, QML, MapLibre, and WebEngine resources
        shell: pwsh
        working-directory: eduescale-desktop
        run: |
          $viewer = ".\.nox\build\Scripts\pyi-archive_viewer.exe"
          $guiContents = (& $viewer -l ".\dist\eduescale-gui.exe") -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect the GUI executable." }
          if ($guiContents -notmatch "QtQuick.*Controls.*Material.*qmldir") {
            throw "Qt Quick Controls Material resources are missing from the GUI."
          }
          if ($guiContents -notmatch "certifi.*cacert\.pem") {
            throw "The GUI certificate bundle is missing."
          }
          if ($guiContents -notmatch "Qt6WebEngineCore\.dll" -or
              $guiContents -notmatch "QtWebEngineProcess\.exe") {
            throw "Qt WebEngine components are missing from the GUI."
          }
          if ($guiContents -notmatch "resources\.rcc") {
            throw "The EduEscale Qt resource bundle is missing from the GUI."
          }
          $resourceCheck = @'
          from pathlib import Path
          from PySide6.QtCore import QFile, QResource

          resource_path = Path("eduescale/gui/resources.rcc")
          if not QResource.registerResource(str(resource_path.resolve())):
              raise SystemExit(f"Could not load {resource_path}")
          resources = (
              ":/eduescale/gui/assets/maplibre/maplibre-gl.js",
              ":/eduescale/gui/assets/maplibre/maplibre-gl.css",
              ":/eduescale/gui/assets/maplibre/map.html",
              ":/eduescale/gui/assets/districts_map.json",
              ":/eduescale/gui/assets/districts_map_hierarchy.json",
              ":/eduescale/gui/qml/DistrictMap.qml",
              ":/eduescale/gui/qml/Main.qml",
          )
          missing = [resource for resource in resources if not QFile(resource).exists()]
          if missing:
              raise SystemExit(f"Missing Qt resources: {missing}")
          '@
          $resourceCheck | & ".\.nox\build\Scripts\python.exe" -
          if ($LASTEXITCODE -ne 0) {
            throw "Resources are missing from the EduEscale Qt bundle."
          }
          $scraperContents = (& $viewer -l ".\dist\eduescale-scraper\eduescale-scraper.exe") -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect the scraper executable." }
          $scraperCertificate = Get-ChildItem ".\dist\eduescale-scraper" -Filter "cacert.pem" -Recurse
          if ($null -eq $scraperCertificate) {
            throw "The scraper certificate bundle is missing."
          }
      - name: Upload Windows application and installer
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: eduescale-windows-${{ github.sha }}
          path: |
            eduescale-desktop/dist/eduescale-gui.exe
            eduescale-desktop/dist/eduescale-scraper/
            eduescale-desktop/dist/installer/
          retention-days: 7
