name: Desktop CI

on:
  push:
    paths:
      - "eduescale-desktop/**"
      - "format/**"
      - "test-fixtures/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "eduescale-desktop/**"
      - "format/**"
      - "test-fixtures/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "eduescale-desktop/uv.lock"
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Run tests, lint, and Windows builds
        run: uv run --locked --group nox nox -s tests lint build
        working-directory: eduescale-desktop
      - name: Verify Windows installer
        shell: pwsh
        working-directory: eduescale-desktop
        run: |
          $installer = Get-ChildItem ".\dist\installer\EduEscale-Setup-*.exe" -File
          if ($null -eq $installer) {
            throw "The Inno Setup installer was not generated."
          }
      - name: Smoke-test scraper executable
        run: .\dist\eduescale-scraper\eduescale-scraper.exe list
        working-directory: eduescale-desktop
      - name: Verify packaged TLS, QML, MapLibre, and WebEngine resources
        shell: pwsh
        working-directory: eduescale-desktop
        run: |
          $guiFiles = @(
            ".\dist\eduescale-gui\eduescale-gui.exe",
            ".\dist\eduescale-gui\_internal\PySide6\qml\QtQuick\Controls\Material\qmldir",
            ".\dist\eduescale-gui\_internal\certifi\cacert.pem",
            ".\dist\eduescale-gui\_internal\PySide6\Qt6WebEngineCore.dll",
            ".\dist\eduescale-gui\_internal\PySide6\QtWebEngineProcess.exe",
            ".\dist\eduescale-gui\_internal\eduescale\gui\resources.rcc"
          )
          foreach ($file in $guiFiles) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing packaged GUI file: $file"
            }
          }
          $resourceCheck = @'
          from pathlib import Path
          from PySide6.QtCore import QFile, QResource

          resource_path = Path("dist/eduescale-gui/_internal/eduescale/gui/resources.rcc")
          if not QResource.registerResource(str(resource_path.resolve())):
              raise SystemExit(f"Could not load {resource_path}")
          resources = (
              ":/eduescale/gui/assets/maplibre/maplibre-gl.js",
              ":/eduescale/gui/assets/maplibre/maplibre-gl.css",
              ":/eduescale/gui/assets/maplibre/map.html",
              ":/eduescale/gui/assets/districts_map.json",
              ":/eduescale/gui/assets/districts_map_hierarchy.json",
              ":/eduescale/gui/qml/EduEscale/Gui/Maps/DistrictMap.qml",
              ":/eduescale/gui/qml/Main.qml",
          )
          missing = [resource for resource in resources if not QFile(resource).exists()]
          if missing:
              raise SystemExit(f"Missing Qt resources: {missing}")
          '@
          $resourceCheck | & ".\.nox\build\Scripts\python.exe" -
          if ($LASTEXITCODE -ne 0) {
            throw "Resources are missing from the EduEscale Qt bundle."
          }
          $viewer = ".\.nox\build\Scripts\pyi-archive_viewer.exe"
          $scraperContents = (& $viewer -l ".\dist\eduescale-scraper\eduescale-scraper.exe") -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect the scraper executable." }
          $scraperCertificate = Get-ChildItem ".\dist\eduescale-scraper" -Filter "cacert.pem" -Recurse
          if ($null -eq $scraperCertificate) {
            throw "The scraper certificate bundle is missing."
          }
      - name: Prepare portable Windows application
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        working-directory: eduescale-desktop
        run: |
          Copy-Item ".\dist\eduescale-scraper" ".\dist\eduescale-gui\eduescale-scraper" -Recurse
          & ".\dist\eduescale-gui\eduescale-scraper\eduescale-scraper.exe" list
          if ($LASTEXITCODE -ne 0) { throw "The portable scraper could not start." }
      - name: Upload Windows application and installer
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: eduescale-windows-${{ github.sha }}
          path: |
            eduescale-desktop/dist/eduescale-gui/
            eduescale-desktop/dist/installer/
          retention-days: 7
