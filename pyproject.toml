[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "eduescale"
version = "0.1.0"
description = "Cliente y buscador de servicios educativos del padrón oficial de ESCALE"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.5",
    "pyside6>=6.12.0",
    "pydantic>=2.7.0",
    "requests>=2.32.0",
    "scrapy>=2.19.0",
]

[dependency-groups]
nox = [
    "nox",
    "nox-uv",
]
lint = [
    "ruff",
]
build = [
    "pyinstaller",
]
test = [
    "pytest",
]

[project.scripts]
eduescale-gui = "eduescale.gui.application:main"

[tool.hatch.build.targets.wheel]
packages = ["eduescale"]

[tool.hatch.build.targets.wheel.force-include]
"eduescale/scrapy.cfg" = "eduescale/scrapy.cfg"
"eduescale/gui/qml/Main.qml" = "eduescale/gui/qml/Main.qml"

[tool.hatch.build.targets.sdist]
only-include = ["README.md", "pyproject.toml", "eduescale"]

[tool.hatch.build.targets.sdist.force-include]
"eduescale/scrapy.cfg" = "eduescale/scrapy.cfg"
"eduescale/gui/qml/Main.qml" = "eduescale/gui/qml/Main.qml"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
