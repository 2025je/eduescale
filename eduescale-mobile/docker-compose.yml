services:
  android:
    build:
      context: ..
      dockerfile: eduescale-mobile/Dockerfile
      target: android-build
      args:
        SOURCE_ROOT: eduescale-mobile
      secrets:
        - source: release_keystore
          target: release_keystore
        - source: keystore_properties
          target: keystore_properties
    working_dir: /workspace
    volumes:
      - ./dist:/output
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /output
        cp app/build/outputs/apk/complete/debug/app-complete-debug.apk /output/EduEscale-completa-debug.apk
        cp app/build/outputs/apk/androidTest/complete/debug/app-complete-debug-androidTest.apk /output/EduEscale-completa-debug-androidTest.apk
        cp app/build/outputs/apk/lite/debug/app-lite-debug.apk /output/EduEscale-lite-debug.apk
        cp app/build/outputs/apk/androidTest/lite/debug/app-lite-debug-androidTest.apk /output/EduEscale-lite-debug-androidTest.apk
        for flavor in complete lite; do
          if [ "$$flavor" = complete ]; then
            label=completa
          else
            label=lite
          fi
          apk_dir="app/build/outputs/apk/$$flavor/release"
          bundle="app/build/outputs/bundle/$${flavor}Release/app-$${flavor}-release.aab"
          if [ -f "$$apk_dir/app-$${flavor}-release.apk" ]; then
            cp "$$apk_dir/app-$${flavor}-release.apk" "/output/EduEscale-$${label}-release.apk"
            cp "$$bundle" "/output/EduEscale-$${label}-release.aab"
          else
            cp "$$apk_dir/app-$${flavor}-release-unsigned.apk" "/output/EduEscale-$${label}-release-unsigned.apk"
            cp "$$bundle" "/output/EduEscale-$${label}-release-unsigned.aab"
          fi
        done

secrets:
  release_keystore:
    file: ../android-secrets/release.jks
  keystore_properties:
    file: ../android-secrets/keystore.properties
