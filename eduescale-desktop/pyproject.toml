[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "eduescale"
version = "0.1.0"
description = "Cliente y buscador de servicios educativos del padrón oficial de ESCALE"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.5",
    "pyside6-essentials>=6.12.0",
    "pydantic>=2.7.0",
    "requests>=2.32.0",
    "scrapy>=2.19.0",
    "urllib3>=2.0,<3",
    "pyside6-addons>=6.12.0",
    "pyside6-webengine>=6.12.0",
]

[dependency-groups]
nox = [
    "nox",
    "nox-uv",
]
lint = [
    "mypy",
    "ruff",
    "types-openpyxl",
]
build = [
    "pyinstaller",
]
test = [
    "pytest",
]
mapdata = [
    "shapely>=2.0",
]

[project.scripts]
eduescale-gui = "eduescale.gui.application:main"

[tool.hatch.build.targets.wheel]
packages = ["eduescale"]

[tool.hatch.build.targets.wheel.force-include]
"eduescale/scrapy.cfg" = "eduescale/scrapy.cfg"
"eduescale/gui/qml/Main.qml" = "eduescale/gui/qml/Main.qml"
"eduescale/gui/qml/DistrictMap.qml" = "eduescale/gui/qml/DistrictMap.qml"
"eduescale/gui/assets/edutrack-logo.png" = "eduescale/gui/assets/edutrack-logo.png"
"eduescale/gui/assets/districts_map.json" = "eduescale/gui/assets/districts_map.json"
"eduescale/gui/assets/districts_map_hierarchy.json" = "eduescale/gui/assets/districts_map_hierarchy.json"
"eduescale/gui/assets/maplibre/map.html" = "eduescale/gui/assets/maplibre/map.html"
"eduescale/gui/assets/maplibre/maplibre-gl.js" = "eduescale/gui/assets/maplibre/maplibre-gl.js"
"eduescale/gui/assets/maplibre/maplibre-gl.css" = "eduescale/gui/assets/maplibre/maplibre-gl.css"
"eduescale/gui/assets/maplibre/LICENSE.txt" = "eduescale/gui/assets/maplibre/LICENSE.txt"
"eduescale/gui/fonts/Roboto-Variable.ttf" = "eduescale/gui/fonts/Roboto-Variable.ttf"
"eduescale/gui/fonts/OFL.txt" = "eduescale/gui/fonts/OFL.txt"

[tool.hatch.build.targets.sdist]
only-include = ["README.md", "pyproject.toml", "eduescale", "scripts"]

[tool.hatch.build.targets.sdist.force-include]
"eduescale/scrapy.cfg" = "eduescale/scrapy.cfg"
"eduescale/gui/qml/Main.qml" = "eduescale/gui/qml/Main.qml"
"eduescale/gui/qml/DistrictMap.qml" = "eduescale/gui/qml/DistrictMap.qml"
"eduescale/gui/assets/edutrack-logo.png" = "eduescale/gui/assets/edutrack-logo.png"
"eduescale/gui/assets/districts_map.json" = "eduescale/gui/assets/districts_map.json"
"eduescale/gui/assets/districts_map_hierarchy.json" = "eduescale/gui/assets/districts_map_hierarchy.json"
"eduescale/gui/assets/maplibre/map.html" = "eduescale/gui/assets/maplibre/map.html"
"eduescale/gui/assets/maplibre/maplibre-gl.js" = "eduescale/gui/assets/maplibre/maplibre-gl.js"
"eduescale/gui/assets/maplibre/maplibre-gl.css" = "eduescale/gui/assets/maplibre/maplibre-gl.css"
"eduescale/gui/assets/maplibre/LICENSE.txt" = "eduescale/gui/assets/maplibre/LICENSE.txt"
"eduescale/gui/fonts/Roboto-Variable.ttf" = "eduescale/gui/fonts/Roboto-Variable.ttf"
"eduescale/gui/fonts/OFL.txt" = "eduescale/gui/fonts/OFL.txt"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.mypy]
python_version = "3.10"
files = ["eduescale"]
check_untyped_defs = true
warn_unused_configs = true
